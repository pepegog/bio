<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social - pepegog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-glow"></div>
  <canvas id="bg-canvas"></canvas>

  <main class="card">
    <div class="social-container">
      <!-- Steam -->
      <a href="https://steamcommunity.com/id/steampepegog" class="social-link" target="_blank" rel="noopener noreferrer">
        <img src="steam.png" alt="Steam" class="social-icon">
        <span class="social-text">Steam</span>
      </a>

      <!-- Telegram -->
      <a href="https://t.me/pepegogofficial" class="social-link" target="_blank" rel="noopener noreferrer">
        <img src="telegram.png" alt="Telegram" class="social-icon">
        <span class="social-text">Telegram</span>
      </a>
    </div>

    <nav class="nav-buttons" style="margin-top: 2rem;">
      <a href="index.html" class="btn">| Back |</a>
    </nav>
  </main>

  <script src="main.js" defer></script>
</body>
</html>
